name: PocketStrike Android APK

on:
  push:
    branches:
      - pocketstrike-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARM64 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check toolchain
        run: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      - name: Restore missing Gradle wrapper if needed
        shell: bash
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating missing Gradle wrapper..."
            URL=$(sed -n 's/^distributionUrl=//p' android/gradle/wrapper/gradle-wrapper.properties | sed 's/\\:/:/g')
            VERSION=$(basename "$URL" | sed -E 's/^gradle-([0-9.]+)-.*/\1/')
            if [ -z "$URL" ] || [ -z "$VERSION" ]; then
              echo "Could not read Gradle distribution URL"
              exit 1
            fi
            curl -fL "$URL" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
            "/tmp/gradle-$VERSION/bin/gradle" -p android wrapper --gradle-version "$VERSION"
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketStrike-Android-ARM64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
